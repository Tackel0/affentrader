[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.25.0"

[functions]
  node_bundler = "esbuild"

# Next.js is detected automatically and deployed using Netlify's adapter.
# Configure authentication and AFFENTRADER_STORAGE in Netlify's environment UI
# with Functions runtime scope. Never put credentials in this file.
